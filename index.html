.x{position:absolute;right:12px;top:8px;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}

$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(cur);$("#cp").textContent="Copied ✓"}catch(e){$("#cp").textContent="Select & copy"}};
let dk=matchMedia("(prefers-color-scheme: dark)").matches;
$("#th").onclick=()=>{dk=!dk;document.documentElement.dataset.theme=dk?"dark":"light"};
function render(){
const tabs=$("#tabs");tabs.innerHTML="";
D.forEach((d,k)=>{const b=document.createElement("button");b.className="tab"+(k==T&&!Q?" on":"");b.textContent=d.t;b.onclick=()=>{T=k;Q="";$("#q").value="";render()};tabs.appendChild(b)});
const tr=$("#tree");tr.innerHTML="";let gs=D[T].g;
if(Q){const m=[];D.forEach(t=>t.g.forEach(g=>g.i.forEach(x=>{if((x[0]+" "+x[1]+" "+x[2]).toLowerCase().includes(Q))m.push(x)})));gs=[{n:"🔎 Results ("+m.length+")",i:m}]}
else tr.innerHTML='<div class="root">'+D[T].r+'</div><div class="stem"></div>';
const gr=document.createElement("div");gr.className="grid";
gs.forEach(g=>{const c=document.createElement("div");c.className="grp";const h=document.createElement("h3");h.textContent=g.n;c.appendChild(h);
g.i.forEach(x=>{const b=document.createElement("button");b.className="it";b.textContent=x[0];b.onclick=()=>show(x,b);c.appendChild(b)});gr.appendChild(c)});
tr.appendChild(gr)}
$("#q").oninput=e=>{Q=e.target.value.trim().toLowerCase();render()};
render();
</script></body></html>
